name: Run Wardrobe Scheduler

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      force_style_check:
        description: 'Force run Daily Style Check immediately'
        required: false
        type: boolean
        default: false

jobs:
  run-scheduler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Run Scheduler
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TO: ${{ secrets.WHATSAPP_TO }}
        run: |
          if [ "${{ inputs.force_style_check }}" = "true" ]; then
            python scheduler.py --run-style-check
          else
            python scheduler.py
          fi

      - name: Commit Run State and Deals
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add scheduler_state.json latest_clothing_deals.md style_history.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-update run state and clothing deals [skip ci]"
            git pull --rebase origin main
            git push
          fi
